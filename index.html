<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Montserrat:wght@400;500;600;700&family=Noto+Serif+JP:wght@400;600&display=swap" rel="stylesheet" />

    <title>FloodGuard - Cảnh báo &amp; Quản lý Rủi ro Ngập lụt</title>
</head>

<body>
    <script>
        (function() {
            try {
                var s = localStorage.getItem('appSettings');
                var theme = 'dark';
                if (s) {
                    var p = JSON.parse(s);
                    if (p && (p.theme === 'light' || p.theme === 'dark')) theme = p.theme;
                }
                document.documentElement.classList.add(theme);
                document.body.classList.add(theme === 'light' ? 'light-theme' : 'dark-theme');
            } catch (e) {}
        })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
</body>

</html>
